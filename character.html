<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Architect Pro | Premium Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        select, input { cursor: pointer; transition: all 0.2s; }
        select:hover, input:hover { border-color: #10b981; }
    </style>
</head>
<body class="h-screen flex flex-col lg:flex-row overflow-hidden">

    <div class="flex-1 overflow-y-auto p-4 lg:p-8">
        <div class="max-w-6xl mx-auto glass rounded-2xl lg:rounded-[2rem] p-5 lg:p-8 shadow-2xl">
            
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-end gap-4 mb-8 border-b border-slate-700/50 pb-6">
                <div>
                    <h1 class="text-2xl lg:text-3xl font-black bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent mb-1">
                        CHARACTER ARCHITECT PRO
                    </h1>
                    <p class="text-slate-400 text-sm">Persistent DNA tracking & environmental design.</p>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 items-center w-full xl:w-auto bg-slate-900/80 p-3 rounded-xl border border-slate-700">
                    <select id="presetLoader" onchange="loadPreset()" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs outline-none w-full sm:w-48 text-slate-300">
                        <option value="">-- Load Saved Character --</option>
                    </select>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="savePreset()" class="flex-1 sm:flex-none px-3 py-2 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-lg text-xs font-bold transition border border-emerald-500/30 whitespace-nowrap">
                            Save Current
                        </button>
                        <button onclick="refreshApp()" class="flex-1 sm:flex-none px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 transition border border-slate-600">
                            Refresh
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="p-4 lg:p-6 bg-slate-900/50 rounded-2xl border border-slate-700/50 shadow-inner">
                    <label class="block text-xs font-bold uppercase tracking-widest text-emerald-400 mb-4">1. Immutable Character DNA</label>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Age & Gender</label>
                            <select id="demographic" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="woman">Woman</option>
                                <option value="man">Man</option>
                                <option value="young girl">Young Girl</option>
                                <option value="young boy">Young Boy</option>
                                <option value="elderly woman">Elderly Woman</option>
                                <option value="elderly man">Elderly Man</option>
                                <option value="androgynous person">Androgynous</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Heritage / Ethnicity</label>
                            <select id="ethnicity" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="European/Caucasian">European / Caucasian</option>
                                <option value="East Asian">East Asian</option>
                                <option value="South Asian">South Asian / Indian</option>
                                <option value="Black/African">Black / African</option>
                                <option value="Middle Eastern">Middle Eastern</option>
                                <option value="Hispanic/Latino">Hispanic / Latino</option>
                                <option value="Indigenous">Indigenous</option>
                                <option value="Mixed Heritage">Mixed Heritage</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Skin Tone</label>
                            <select id="skinTone" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="pale, porcelain">Pale / Porcelain</option>
                                <option value="fair, peachy">Fair</option>
                                <option value="medium, sun-kissed">Medium / Sun-kissed</option>
                                <option value="warm olive">Warm Olive</option>
                                <option value="golden bronze">Golden Bronze</option>
                                <option value="rich brown">Rich Brown</option>
                                <option value="deep ebony">Deep Ebony</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Build / Body Type</label>
                            <select id="build" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="slim, average height">Slim / Average</option>
                                <option value="generously proportioned">Generously Proportioned</option>
                                <option value="tall and athletic">Tall & Athletic</option>
                                <option value="petite and delicate">Petite</option>
                                <option value="heavily muscular">Muscular</option>
                                <option value="tall and slender">Tall & Slender</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Eye Color</label>
                            <select id="eyes" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="pale blue" selected>Pale Blue</option>
                                <option value="deep brown">Deep Brown</option>
                                <option value="emerald green">Emerald Green</option>
                                <option value="striking hazel">Hazel</option>
                                <option value="stormy grey">Stormy Grey</option>
                                <option value="golden amber">Golden Amber</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Hair Color</label>
                            <select id="hairColor" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="brunette">Brunette</option>
                                <option value="blonde">Blonde</option>
                                <option value="fiery red">Redhead</option>
                                <option value="jet black">Jet Black</option>
                                <option value="silver/grey">Silver / Grey</option>
                                <option value="pastel pink">Pastel Pink</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Hair Style / Length</label>
                            <select id="hairStyle" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none">
                                <option value="long flowing">Long Flowing</option>
                                <option value="shoulder-length wavy">Shoulder-Length Wavy</option>
                                <option value="short textured crop">Short Textured Crop</option>
                                <option value="sleek bob cut">Sleek Bob</option>
                                <option value="messy unkempt">Messy / Unkempt</option>
                                <option value="tight braids">Braided</option>
                                <option value="voluminous afro">Afro</option>
                                <option value="dreadlocks">Dreadlocks</option>
                                <option value="sharp buzz cut">Buzz Cut</option>
                                <option value="completely bald">Bald</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-500 mb-1">Signature Attire</label>
                            <input id="attire" type="text" placeholder="e.g., a fitted charcoal trench coat" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none cursor-text focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 lg:gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Artistic Style</label>
                        <select id="artStyle" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none border-l-2 border-l-blue-500">
                            <option value="photorealistic, 8k resolution, highly detailed photography">Photorealistic</option>
                            <option value="high-end 3D animated style, Pixar/Disney animation quality">3D Animated Style</option>
                            <option value="classic oil painting, visible brushstrokes, masterwork">Oil Painting</option>
                            <option value="delicate watercolor illustration, soft color bleeds">Watercolor</option>
                            <option value="bold pop-art style, halftone dots, vibrant flat colors">Pop-Art Style</option>
                            <option value="dynamic comic book character style, ink lines, cel shading">Comic Book Style</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Camera Angle</label>
                        <select id="pose" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none">
                            <option value="Medium portrait shot">Medium Portrait</option>
                            <option value="Extreme close-up macro portrait">Close-up</option>
                            <option value="Full body shot">Full Body</option>
                            <option value="Over-the-shoulder perspective">Over the Shoulder</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Expression</label>
                        <select id="expression" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none">
                            <option value="neutral, focused expression">Neutral / Focused</option>
                            <option value="warm, genuine smile">Warm Smile</option>
                            <option value="intense, dramatic glare">Intense Glare</option>
                            <option value="looking off-camera lost in thought">Contemplative</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Environment</label>
                        <div class="space-y-3">
                            <select id="environmentDropdown" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none">
                                <option value="soft studio background with volumetric lighting">Studio Backdrop (Default)</option>
                                <option value="bustling cyberpunk city street at night with neon lights">Cyberpunk City (Night)</option>
                                <option value="sunlit modern office interior, bright and airy">Modern Office (Day)</option>
                                <option value="dense misty ancient forest, dappled sunlight">Misty Forest</option>
                                <option value="minimalist concrete brutalist architecture">Brutalist Architecture</option>
                            </select>
                            <input id="environmentCustom" type="text" placeholder="Or type custom override..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm outline-none cursor-text focus:border-emerald-500 focus:bg-slate-950">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 p-4 lg:p-5 bg-black/60 rounded-2xl border border-emerald-500/20 relative">
                <div id="currentOutput" class="text-emerald-50 text-sm leading-relaxed italic min-h-[60px] break-words">
                    Your customized character prompt will appear here...
                </div>
            </div>

            <button onclick="generateCharacterPrompt()" class="w-full mt-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.01]">
                Generate Prompt & Save to History
            </button>
        </div>
    </div>

    <div class="w-full lg:w-80 bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-[35vh] lg:h-full shadow-2xl z-10 shrink-0">
        <div class="p-4 lg:p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950 sticky top-0">
            <h2 class="text-sm font-bold uppercase tracking-widest text-slate-300">Session History</h2>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide">
            <div class="text-xs text-slate-600 text-center mt-10" id="emptyState">No prompts generated yet.</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", updatePresetDropdown);

        function generateCharacterPrompt() {
            const demo = document.getElementById('demographic').value;
            const ethnicity = document.getElementById('ethnicity').value;
            const skinTone = document.getElementById('skinTone').value;
            const build = document.getElementById('build').value;
            const eyes = document.getElementById('eyes').value;
            const hairColor = document.getElementById('hairColor').value;
            const hairStyle = document.getElementById('hairStyle').value;
            const attire = document.getElementById('attire').value;
            const pose = document.getElementById('pose').value;
            const expression = document.getElementById('expression').value;
            const artStyle = document.getElementById('artStyle').value;
            
            const envDrop = document.getElementById('environmentDropdown').value;
            const envCustom = document.getElementById('environmentCustom').value;
            const env = envCustom.trim() !== "" ? envCustom : envDrop;

            const attireText = attire ? ` Wearing ${attire}.` : '';

            let prompt = `CHARACTER PORTRAIT: ${pose}. A ${build} ${ethnicity} ${demo} with ${skinTone} skin. They have ${hairStyle} ${hairColor} hair and ${eyes} eyes.${attireText} Expression: ${expression}. Setting: ${env}. Rendered in ${artStyle} --v 6.0`;

            document.getElementById('currentOutput').innerText = prompt;
            navigator.clipboard.writeText(prompt);
            addToHistory(prompt);
        }

        function addToHistory(promptText) {
            const historyList = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            if(emptyState) emptyState.remove();

            const historyItem = document.createElement('div');
            historyItem.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 relative group text-xs transition hover:border-emerald-500/50';
            historyItem.innerHTML = `
                <p class="text-slate-300 italic mb-3 line-clamp-4">${promptText}</p>
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-slate-500 uppercase">${new Date().toLocaleTimeString()}</span>
                    <button onclick="copySpecific(this, '${promptText.replace(/'/g, "\\'")}')" class="text-emerald-400 hover:text-emerald-300 font-bold transition">COPY</button>
                </div>
            `;
            historyList.insertBefore(historyItem, historyList.firstChild);
        }

        function copySpecific(btn, text) {
            navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = "COPIED!";
            setTimeout(() => btn.innerText = originalText, 1500);
        }

        function refreshApp() {
            document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            document.querySelectorAll('input').forEach(i => i.value = '');
            // Ensures explicit defaults are reset properly
            document.getElementById('eyes').value = "pale blue";
            document.getElementById('currentOutput').innerText = 'Your customized character prompt will appear here...';
            document.getElementById('presetLoader').value = "";
        }

        function savePreset() {
            const presetName = prompt("Enter a name to save this character DNA:");
            if (!presetName) return;

            const presetData = {
                demographic: document.getElementById('demographic').value,
                ethnicity: document.getElementById('ethnicity').value,
                skinTone: document.getElementById('skinTone').value,
                build: document.getElementById('build').value,
                eyes: document.getElementById('eyes').value,
                hairColor: document.getElementById('hairColor').value,
                hairStyle: document.getElementById('hairStyle').value,
                attire: document.getElementById('attire').value
            };

            let savedPresets = JSON.parse(localStorage.getItem('characterPresets')) || {};
            savedPresets[presetName] = presetData;
            localStorage.setItem('characterPresets', JSON.stringify(savedPresets));
            
            updatePresetDropdown();
            alert(`Preset '${presetName}' saved successfully!`);
        }

        function updatePresetDropdown() {
            const loader = document.getElementById('presetLoader');
            let savedPresets = JSON.parse(localStorage.getItem('characterPresets')) || {};
            
            loader.innerHTML = '<option value="">-- Load Saved Character --</option>';
            for (const name in savedPresets) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                loader.appendChild(opt);
            }
        }

        function loadPreset() {
            const selectedName = document.getElementById('presetLoader').value;
            if (!selectedName) return;

            let savedPresets = JSON.parse(localStorage.getItem('characterPresets')) || {};
            const data = savedPresets[selectedName];

            if (data) {
                document.getElementById('demographic').value = data.demographic;
                document.getElementById('ethnicity').value = data.ethnicity;
                document.getElementById('skinTone').value = data.skinTone;
                document.getElementById('build').value = data.build;
                document.getElementById('eyes').value = data.eyes;
                document.getElementById('hairColor').value = data.hairColor;
                document.getElementById('hairStyle').value = data.hairStyle;
                document.getElementById('attire').value = data.attire || '';
                
                const dnaBox = document.querySelector('.bg-slate-900\\/50');
                dnaBox.classList.add('border-emerald-500');
                setTimeout(() => dnaBox.classList.remove('border-emerald-500'), 1000);
            }
        }
    </script>
</body>
</html>
